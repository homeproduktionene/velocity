name: Build velocity-cs2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Development, Ship]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install LLVM 20 into Visual Studio toolset
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * -requires Microsoft.Component.MSBuild -property installationPath -latest
          $llvmDest = "$vsPath\VC\Tools\Llvm\x64"

          Write-Host "VS path: $vsPath"
          Write-Host "Installing LLVM 20 to: $llvmDest"

          $releases = Invoke-RestMethod "https://api.github.com/repos/llvm/llvm-project/releases?per_page=50"
          $release  = $releases | Where-Object { $_.tag_name -match "^llvmorg-20\." } | Select-Object -First 1
          $url      = ($release.assets | Where-Object { $_.name -match "^LLVM-20.*-win64\.exe$" } | Select-Object -First 1).browser_download_url

          Write-Host "Downloading: $url"
          $installer = "$env:TEMP\LLVM-20-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer

          & "C:\ProgramData\Chocolatey\bin\7z.exe" x $installer "-o$llvmDest" -y | Out-Null

          Write-Host "Verifying clang-cl..."
          & "$llvmDest\bin\clang-cl.exe" --version

      - name: Build ${{ matrix.configuration }}
        working-directory: cs2
        run: |
          msbuild velocity-cs2.slnx `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:LLVMToolsVersion=20 `
            "/p:AdditionalOptions=-Wno-mismatched-tags" `
            /m `
            /v:minimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-cs2-${{ matrix.configuration }}-x64
          path: cs2/bin/*.dll
          if-no-files-found: error
          retention-days: 30
